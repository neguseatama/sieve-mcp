name: Release

on:
  push:
    tags:
      - "v*"
  # the trial run: the build with the wheel self-check, the .mcpb
  # bundle assembled by the checked-in recipe and packed by the
  # official CLI, the release body extraction with its public-text
  # watch and the SHA256SUMS list run on the manual dispatch and stay
  # as build artifacts; only the provenance attestation and the release
  # attach wait for a tag push (the guard on the publish job), and the
  # bundle rides the attach only when the repository variable says the
  # trial bundle passed on the real Desktop
  workflow_dispatch:

permissions:
  contents: write

env:
  MCPB_CLI_VERSION: "2.1.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Self-check the wheel in a fresh venv
        run: |
          python -m venv smoke
          smoke/bin/python -m pip install --upgrade pip
          smoke/bin/python -m pip install dist/*.whl
          smoke/bin/sieve-mcp-server --self-check

      - name: Upload the build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  mcpb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download the build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build the .mcpb bundle
        # the recipe is the checked-in script: the wheel and its
        # runtime dependencies ride server/lib, the manifest carries
        # the package's version, the official CLI validates and packs
        run: |
          npm install -g "@anthropic-ai/mcpb@${MCPB_CLI_VERSION}"
          python3 tools/build_mcpb.py \
            --wheel "artifacts/sieve_mcp_server-*.whl" \
            --dest bundle

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: bundle/*.mcpb

  release-extras:
    needs: [build, mcpb]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the CHANGELOG
        uses: actions/checkout@v4

      - name: Download the build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: The artifacts carry the release version
        # a tag run compares the tag with the artifacts; a manual trial
        # run has no tag, so the artifacts are compared with the
        # package's version, whose single source is
        # sieve_mcp_server/__init__.py.  A wrong tag or a forgotten
        # version bump stops here, before anything is published.
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c 'import sieve_mcp_server; print(sieve_mcp_server.__version__)')
          fi
          test -f "artifacts/sieve_mcp_server-${VERSION}.tar.gz"
          test -f "artifacts/sieve_mcp_server-${VERSION}-py3-none-any.whl"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Extract the CHANGELOG section for the release body
        run: |
          # the release body is the [version] section of CHANGELOG.md; a
          # version with no section fails here (exit 1), structurally -
          # the tag is cut only after the section exists.  The version
          # is the one the artifact names just matched.
          python3 tools/extract_changelog.py "${RELEASE_VERSION}" > release_body.md

      - name: Public-text watch on the release body
        run: |
          # one hit stops the release: the body reads as facts only
          python3 tools/check_public_text.py --text release_body.md

      - name: Generate SHA256SUMS.txt
        env:
          MCPB_ATTACH: ${{ vars.MCPB_ATTACH }}
        run: |
          cd artifacts
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          # the bundle rides the checksums list only when it rides the
          # release: the repository variable is set after the trial
          # bundle passed on the real Desktop, and a set variable with
          # no bundle file stops here
          if [ "${MCPB_ATTACH}" = "yes" ]; then
            test -f sieve-mcp-*.mcpb
            sha256sum sieve-mcp-*.mcpb >> SHA256SUMS.txt
          fi

      - name: Upload SHA256SUMS.txt as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS.txt
          path: artifacts/SHA256SUMS.txt

      - name: Upload the release body as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: release_body.md

  publish:
    needs: release-extras
    # tag pushes publish; the manual trial run stops here
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest the build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.whl
            artifacts/*.tar.gz

      - name: Stage the release assets
        env:
          MCPB_ATTACH: ${{ vars.MCPB_ATTACH }}
        run: |
          # one staged folder carries everything the release attaches,
          # so the attach step's glob never matches an empty set: the
          # checksums list always rides, the bundle rides only when the
          # repository variable says the trial bundle passed
          mkdir release-assets
          cp artifacts/SHA256SUMS.txt release-assets/
          if [ "${MCPB_ATTACH}" = "yes" ]; then
            test -f artifacts/sieve-mcp-*.mcpb
            cp artifacts/sieve-mcp-*.mcpb release-assets/
          fi

      - name: Attach the release assets and the CHANGELOG body to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: artifacts/release_body.md
