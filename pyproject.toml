[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-mcp-server"
dynamic = ["version"]
description = "Sieve-MCP: the MCP server that hands local files to AI tools in a shareable form, over the sieve-tray engines"
readme = "README.md"
authors = [{ name = "Kai IWASAKI" }]
license = { text = "MIT" }
requires-python = ">=3.10"
# the only runtime dependency: the Tray engines carry the observation,
# the Gate, the metadata clean, the manifest and the verify paths, and
# they run headless without any extra (the gui extra stays out).  The
# ceiling keeps a 3.x rewrite of the engines out of an install of this
# server: the tools ride the 2.x receipt shapes and the 2.x walks
dependencies = ["sieve-tray>=2.6.0,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
]

[project.optional-dependencies]
# the official protocol SDK rides the tests only - the server itself
# speaks the line-delimited JSON protocol with the standard library
test = ["pytest>=8.0", "mcp>=2.3.0"]

[project.urls]
Homepage = "https://github.com/neguseatama/sieve-mcp"
Repository = "https://github.com/neguseatama/sieve-mcp.git"
"Bug Tracker" = "https://github.com/neguseatama/sieve-mcp/issues"

[project.scripts]
sieve-mcp-server = "sieve_mcp_server.cli:main"

[tool.setuptools]
packages = ["sieve_mcp_server"]

[tool.setuptools.dynamic]
version = { attr = "sieve_mcp_server.__version__" }
